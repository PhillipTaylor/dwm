[workspace]
resolver = "2"
members = ["dwm", "dwmenu"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
libc = "0.2"
bitflags = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fontdue = "0.9"
tiny-skia = "0.11"
xkbcommon = "0.9"
smithay = { version = "0.7", default-features = false, features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session",
    "backend_session_libseat",
    "backend_udev",
    "desktop",
    "renderer_gl",
    "renderer_multi",
    "use_system_lib",
    "wayland_frontend",
] }
calloop = "0.14"
input = "0.10"
smithay-drm-extras = "0.2"
drm = "0.14"
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }
rustix = { version = "1", features = ["fs"] }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
